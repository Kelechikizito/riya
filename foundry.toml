[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts",
    "foundry-devops/=lib/foundry-devops/",
    "@aave-v4/=lib/aave-v4/src/",
]

# Creditcoin Testnet omits prevRandao from its block headers, which makes
# `forge script` fail against it. Per the Creditcoin team (CLAUDE.md, Q10).
bypass_prevrandao = true

# The deploy scripts write their addresses to `deployments/`, so the two-chain, three-step
# deployment does not depend on pasting them off a terminal. Nothing else is writable.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    # Where DeploymentRecordTest writes, so the real record is never touched by a test run.
    { access = "read-write", path = "./deployments-test" },
]

# Source-chain verification. One key covers both Ethereum networks on Etherscan v2.
# Creditcoin is a Blockscout chain and needs `--verifier blockscout` instead, which the
# Makefile passes on the destination target.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
mainnet_eth = "${ETH_MAINNET_RPC_URL}"
sepolia_eth = "${ETH_SEPOLIA_RPC_URL}"
creditcoin_testnet = "${CREDITCOIN_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
